# Honor the scheme a front proxy (e.g. host Apache/Caddy terminating TLS) forwards.
# When this container is reached over plain HTTP but the real client was on HTTPS,
# the upstream sets X-Forwarded-Proto: https and we pass it through to Django so
# request.is_secure() and admin CSRF checks are correct. Falls back to the actual
# scheme when no proxy is in front (direct :80 deployment).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Attachment uploads go through the API; the default 1m is too small.
    client_max_body_size 25m;

    # Docker's embedded DNS. Resolving the backend per-request (via the $django
    # variable below) rather than once at startup means nginx boots even if the
    # backend is still starting, and picks up its new IP when it gets recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $django http://backend:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        set $django http://backend:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Tracked-link redirects (apps.links). Django owns this prefix, not the SPA.
    location /r/ {
        set $django http://backend:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django only serves media itself while DEBUG=1, so nginx must do it in production.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # Compress text responses here rather than relying on whatever proxy sits in
    # front. The bundle is ~387kB raw and ~110kB gzipped, so this is the single
    # biggest factor in how fast the app appears on a cold visit.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # Vite fingerprints these filenames (index-DE5sXK-z.js), so a given URL's
    # contents can never change: a new build produces a new name. They are safe to
    # cache forever, and "immutable" stops the browser even asking whether they
    # changed on a repeat visit.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is the file that names the current hashed
    # bundles, so a stale copy points at assets that no longer exist after a deploy.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: every other path is a client-side route, so fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
